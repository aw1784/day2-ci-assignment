name: Day 2 CI

run-name: "CI run triggered by @${{ github.actor }} [Event:${{ github.event_name }}]"

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python Version"
        required: true
        default: "3.13"
        type: choice
        options:
          - "3.12"
          - "3.13"
      create-package:
        description: "Create Package"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read
  pull-requests: write

env:
  APP_NAME: temperature

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Security Pre-Scan
        uses: ./.github/actions/pre-scan

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.13' }}
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install Dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Pytest with JUnit Report
        id: pytest-run
        continue-on-error: true
        run: |
          mkdir -p reports
          pytest -v --junitxml=reports/junit.xml

      - name: Report Failure on Branch
        if: failure()
        run: echo "🚨 Tests failed on ${{ github.ref_name }}"

      - name: Upload Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: reports/junit.xml
          retention-days: 5

      - name: Fail Job If Tests Failed
        if: steps.pytest-run.outcome == 'failure'
        run: exit 1

  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.create-package == true }}
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Version Number
        id: set-version
        run: |
          VERSION="0.1.${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Distribution Archive
        run: |
          mkdir -p dist
          tar -czvf dist/temperature-${{ steps.set-version.outputs.version }}.tar.gz temperature.py README.md

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*.tar.gz

  verify:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Package Artifact
        uses: actions/download-artifact@v4
        with:
          name: package
          path: extracted-dist

      - name: Verify Package Contents
        run: |
          tar -xzvf extracted-dist/*.tar.gz
          python3 -c "from temperature import celsius_to_fahrenheit as c; assert c(100) == 212; print('Package OK')"

      - name: Security Post-Scan
        uses: ./.github/actions/post-scan
        with:
          scan-type: 'fs'
          scan-target: '.'

  pr-comment:
    needs: package
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comment on Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ needs.package.outputs.version }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ CI passed. Package version ${version} is ready.`
            })

  report:
    needs: [test, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN != '' }}
    steps:
      - name: Check Secret and Notify
        if: env.HAS_NOTIFY_TOKEN == 'true'
        run: |
          TOKEN_LEN=${#NOTIFY_TOKEN}
          echo "Notification sent (token length: $TOKEN_LEN)"
        env:
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}

      - name: Generate Job Summary
        run: |
          TITLE="${{ vars.REPORT_TITLE || 'CI Pipeline Report' }}"
          VERSION="${{ needs.package.outputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="n/a"; fi
          
          echo "# $TITLE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Status / Details |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| App Name | $APP_NAME \vert{}" >> $GITHUB_STEP_SUMMARY
          echo "| Version | $VERSION \vert{}" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | `${{ github.sha }}` |" >> $GITHUB_STEP_SUMMARY
          echo "| Event Name | ${{ github.event_name }} \vert{}" >> $GITHUB_STEP_SUMMARY
          echo "| Test Job | ${{ needs.test.result }} \vert{}" >> $GITHUB_STEP_SUMMARY
          echo "| Package Job | ${{ needs.package.result }} \vert{}" >> $GITHUB_STEP_SUMMARY