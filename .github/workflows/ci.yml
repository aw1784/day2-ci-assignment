name: Day 2 CI

run-name: "CI run triggered by @${{ github.actor }} [Event:${{ github.event_name }}]"

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python Version"
        required: true
        default: "3.13"
        type: choice
        options:
          - "3.12"
          - "3.13"
      create-package:
        description: "Create Package"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

env:
  APP_NAME: temperature

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Security Pre-Scan
        uses: ./.github/actions/pre-scan

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version || '3.13' }}
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install Dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Pytest with JUnit Report
        id: pytest-run
        continue-on-error: true
        run: |
          mkdir -p reports
          pytest -v --junitxml=reports/junit.xml

      - name: Report Failure on Branch
        if: steps.pytest-run.outcome == 'failure'
        env:
          BRANCH: ${{ github.ref_name }}
        run: echo "🚨 Tests failed on $BRANCH"

      - name: Upload Test Report Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-report
          path: reports/junit.xml
          retention-days: 5

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Fail Job If Tests Failed
        if: steps.pytest-run.outcome == 'failure'
        run: exit 1

  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.create-package == true }}
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate Version Number
        id: set-version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="0.1.${RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Distribution Archive
        env:
          VERSION: ${{ steps.set-version.outputs.version }}
        run: |
          mkdir -p dist
          tar -czvf "dist/temperature-${VERSION}.tar.gz" temperature.py README.md

      - name: Upload Package Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: dist/*.tar.gz

  verify:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download Package Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package
          path: extracted-dist

      - name: Verify Package Contents
        run: |
          tar -xzvf extracted-dist/*.tar.gz
          python3 -c "from temperature import celsius_to_fahrenheit as c; assert c(100) == 212; print('Package OK')"

      - name: Security Post-Scan
        uses: ./.github/actions/post-scan
        with:
          scan-type: 'fs'
          scan-target: '.'

  pr-comment:
    needs: package
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Comment on Pull Request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          VERSION: ${{ needs.package.outputs.version }}
        with:
          script: |
            const version = process.env.VERSION;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ CI passed. Package version ${version} is ready.`
            })

  report:
    needs: [test, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN != '' }}
    steps:
      - name: Check Secret and Notify
        if: env.HAS_NOTIFY_TOKEN == 'true'
        run: |
          TOKEN_LEN=${#NOTIFY_TOKEN}
          echo "Notification sent (token length: $TOKEN_LEN)"
        env:
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}

      - name: Generate Job Summary
        env:
          TITLE: ${{ vars.REPORT_TITLE || 'CI Pipeline Report' }}
          VERSION: ${{ needs.package.outputs.version }}
          COMMIT: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          VERSION="${VERSION:-n/a}"
          {
            echo "# $TITLE"
            echo ""
            echo "| Metric | Status / Details |"
            echo "|---|---|"
            echo "| App Name | $APP_NAME |"
            echo "| Version | $VERSION |"
            echo "| Commit | \`$COMMIT\` |"
            echo "| Event Name | $EVENT |"
            echo "| Test Job | $TEST_RESULT |"
            echo "| Package Job | $PACKAGE_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
