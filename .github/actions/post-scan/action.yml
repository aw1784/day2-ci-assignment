name: 'Security Post-Scan'
description: 'Runs Trivy to scan built artifacts or extracted package for vulnerabilities.'

inputs:
  scan-type:
    description: 'Type of Trivy scan'
    required: true
    default: 'fs'
  scan-target:
    description: 'Target path to scan'
    required: true
    default: '.'

runs:
  using: "composite"
  steps:
    - name: Run Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: ${{ inputs.scan-type }}
        scan-target: ${{ inputs.scan-target }}
        format: 'table'
        exit-code: '1'
        severity: 'CRITICAL,HIGH'