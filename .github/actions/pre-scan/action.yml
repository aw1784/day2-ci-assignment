name: 'Security Pre-Scan'
description: 'Runs Gitleaks and TruffleHog to scan source code for secrets and sensitive data before building.'

runs:
  using: "composite"
  steps:
    - name: Run Gitleaks Security Scan
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITLEAKS_LICENSE: ""

    - name: Run TruffleHog OSS
      uses: trufflehog/trufflehog-action@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: ${{ github.ref }}
        extra_args: --debug